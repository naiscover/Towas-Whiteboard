<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Towa’s Whiteboards</title>
<link rel="icon" type="image/png" href="/images/favicon.png?v=2">
<link rel="shortcut icon" href="/images/favicon.png?v=2">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('wb-settings')).theme||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sheet { width: min(860px, calc(100% - 32px)); margin: 40px auto 150px; padding: 28px 28px 32px; background: var(--surface);
           border-radius: 14px; box-shadow: var(--shadow); text-align: center; }
  .banner { display: block; margin: 0 auto 22px; width: auto; height: auto; max-width: 100%; max-height: 240px; object-fit: contain; border-radius: 10px; }
  h1 { margin: 0 0 6px; font-size: 32px; line-height: 1.15; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .sub { margin: 0 0 4px; }
  .fine { margin: 0; color: var(--muted); font-size: 13px; }
  .notice { margin: 16px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--notice-bg); color: var(--notice-text); }
  .tabs { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 24px; text-align: left; }
  .tab { flex: 0 1 250px; display: block; min-width: 0; text-decoration: none; color: var(--text); background: var(--card);
         border: 1px solid var(--border); border-top: 4px solid var(--c); border-radius: 10px 10px 4px 4px; padding: 10px; }
  .tab:hover { background: var(--card-hover); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { display: block; width: 100%; aspect-ratio: 8 / 5; object-fit: cover; background: #fff; border-radius: 6px; margin-bottom: 8px; }
  .tab strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab span { display: block; font-size: 13px; color: var(--muted); }
  .empty { margin-top: 24px; color: var(--muted); }
  .plus { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 2; width: 60px; height: 60px; border: 0;
          border-radius: 50%; background: var(--primary); color: var(--primary-text); cursor: pointer; display: grid; place-items: center;
          box-shadow: 0 6px 20px rgba(0,0,0,.35); transition: box-shadow .2s ease, transform .2s ease; }
  .plus:hover, .plus:focus-visible { transform: translateX(-50%) scale(1.08);
          box-shadow: 0 0 0 4px rgba(124,178,255,.35), 0 0 26px 8px rgba(124,178,255,.75); outline: none; }
  @media (prefers-reduced-motion: reduce) { .plus { transition: none; } }
</style>
</head>
<body data-page="home">
  <main class="sheet">
    <img class="banner" src="/images/home-banner.gif" alt="" onerror="this.remove()">
    <h1 id="welcome">Welcome</h1>
    <p class="sub">Pick a room to draw in, or press the plus button to create one.</p>
    <p class="fine">Rooms are deleted automatically when their timer runs out (30 days at most).</p>
    <p class="notice" id="notice" hidden>That room no longer exists. It may have expired.</p>
    <div class="tabs" id="tabs" role="list"></div>
    <p class="empty" id="empty" hidden>No rooms yet. Press the plus button to create the first one.</p>
  </main>

  <button class="plus" id="plus" type="button" aria-label="Create a room" title="Create a room">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog class="wb-dialog" id="createDlg">
    <form id="createForm">
      <h2>Create a room</h2>
      <label class="wb-field">Room name<input id="cName" type="text" maxlength="40" placeholder="Untitled room" autocomplete="off"></label>
      <label class="wb-field">Capacity (people)<input id="cCap" type="number" min="2" max="100" value="20" required></label>
      <label class="wb-field">Deletes after
        <select id="cExpiry"><option value="1">1 day</option><option value="7">7 days</option><option value="30" selected>30 days</option></select>
      </label>
      <label class="wb-check"><input type="checkbox" id="cPriv"> Private: ask for a password to join</label>
      <label class="wb-field" id="cPwWrap" hidden>Password<input id="cPw" type="password" minlength="4" maxlength="64" autocomplete="new-password" placeholder="At least 4 characters"></label>
      <label class="wb-check"><input type="checkbox" id="cListed" checked> Show this room on the home page</label>
      <label class="wb-check"><input type="checkbox" id="cBlur"> Blur the home page preview (private rooms are always blurred)</label>
      <label class="wb-check"><input type="checkbox" id="cOwner"> Only I can clear the board</label>
      <p class="wb-err" id="cErr" role="alert"></p>
      <div class="wb-actions">
        <button type="button" class="wb-btn" id="cCancel">Cancel</button>
        <button type="submit" class="wb-btn primary" id="cGo">Create room</button>
      </div>
    </form>
  </dialog>

<script src="/sidebar.js"></script>
<script>
(() => {
  const COLORS = ['#1d2733', '#e5484d', '#f5a524', '#2f9e6f', '#2f6fed', '#8b5cf6'];
  const $ = (id) => document.getElementById(id);

  const renderWelcome = () => { const n = WB.name(); $('welcome').textContent = n ? 'Welcome, ' + n : 'Welcome'; };
  renderWelcome();
  WB.onChange((k) => { if (k === 'name') renderWelcome(); });
  if (new URLSearchParams(location.search).get('missing')) $('notice').hidden = false;

  // ---- Room tabs with live previews ----
  const colorFor = (id) => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  function timeLeft(ts) {
    const ms = ts - Date.now(), d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5);
    if (d >= 1) return 'Deletes in ' + plural(d, 'day');
    if (h >= 1) return 'Deletes in ' + plural(h, 'hour');
    return 'Deletes within the hour';
  }
  let lastSig = '';
  function render(rooms) {
    const sig = JSON.stringify(rooms.map((r) => [r.id, r.name, r.people, r.capacity, r.private, r.updatedAt, timeLeft(r.expiresAt)]));
    if (sig === lastSig) return;
    lastSig = sig;
    const tabs = $('tabs');
    tabs.textContent = '';
    $('empty').hidden = rooms.length > 0;
    for (const r of rooms) {
      const a = document.createElement('a');
      a.className = 'tab'; a.href = '/b/' + r.id; a.setAttribute('role', 'listitem');
      a.style.setProperty('--c', colorFor(r.id));
      const img = document.createElement('img');
      img.className = 'thumb'; img.alt = ''; img.loading = 'lazy';
      img.src = '/api/rooms/' + r.id + '/preview.svg?v=' + r.updatedAt;   // the version changes when the board does
      a.appendChild(img);
      const lines = [r.name, r.people + ' of ' + r.capacity + ' here', timeLeft(r.expiresAt)];
      if (r.private) lines.splice(2, 0, 'Password required');
      lines.forEach((text, i) => {
        const el = document.createElement(i === 0 ? 'strong' : 'span');
        el.textContent = text;                       // textContent: names are untrusted
        a.appendChild(el);
      });
      tabs.appendChild(a);
    }
  }
  async function load() {
    if (document.hidden) return;
    try { render(await (await fetch('/api/rooms', { cache: 'no-store' })).json()); } catch {}
  }
  load(); setInterval(load, 5000);

  // ---- Create room popup ----
  const dlg = $('createDlg');
  $('plus').addEventListener('click', () => { $('cErr').textContent = ''; $('cGo').disabled = false; dlg.showModal(); $('cName').focus(); });
  $('cCancel').addEventListener('click', () => dlg.close());
  $('cPriv').addEventListener('change', (e) => {
    $('cPwWrap').hidden = !e.target.checked;
    $('cPw').required = e.target.checked;
    if (e.target.checked) $('cPw').focus();
  });
  $('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('cGo').disabled = true; $('cErr').textContent = '';
    const body = {
      name: $('cName').value.trim(), capacity: +$('cCap').value, expiryDays: +$('cExpiry').value,
      private: $('cPriv').checked, password: $('cPw').value, listed: $('cListed').checked,
      blurPreview: $('cBlur').checked, ownerOnlyClear: $('cOwner').checked,
    };
    try {
      const res = await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not create the room.');
      try {
        localStorage.setItem('wb-owner-' + data.id, data.ownerKey);                 // proves you created it
        if (body.private) sessionStorage.setItem('wb-pw-' + data.id, body.password); // skip the password prompt for you
      } catch {}
      location.href = '/b/' + data.id;
    } catch (ex) {
      $('cErr').textContent = ex.message; $('cGo').disabled = false;
    }
  });
})();
</script>
</body>
</html>
